name: Job Scraper Bot

on:
  schedule:
    # Türkiye saati ile (UTC+3) 10:00, 12:00, 14:00, 16:00'da çalışması için UTC saatleri girilmiştir:
    # 07:00 UTC = 10:00 TSİ
    # 09:00 UTC = 12:00 TSİ
    # 11:00 UTC = 14:00 TSİ
    # 13:00 UTC = 16:00 TSİ
    - cron: '0 7,9,11,13 * * *'
  workflow_dispatch: # Manuel tetikleme butonu ekler

permissions:
  contents: write # Veritabanını repoya push edebilmek için gerekli izin

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla (Checkout)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium # Sadece Chromium kuruyoruz (hız ve yer tasarrufu)
          playwright install-deps chromium # Ubuntu için gerekli sistem kütüphaneleri

      - name: Scraper Botu Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: SQLite Veritabanını Kaydet (Commit & Push)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add jobs.db
          # Sadece jobs.db değişmişse commit atar, değişmediyse hata vermeden geçer
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update jobs.db [skip ci]" && git push)