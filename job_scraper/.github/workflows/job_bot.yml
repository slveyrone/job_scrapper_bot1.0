name: Job Scraper Bot

on:
  schedule:
    - cron: '0 7,9,11,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright playwright-stealth requests python-dotenv
          python -m playwright install chromium --with-deps

      - name: Scraper Botu Calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Veritabanini Kaydet
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add jobs.db || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update jobs.db [skip ci]" && git push)
